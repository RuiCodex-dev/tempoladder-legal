<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Rungwise: privacy policy site for the tempo practice app">
<title>Rungwise: legal pages</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2=".6"><stop offset="0" stop-color="#121a2e"/><stop offset=".55" stop-color="#1b2a4a"/><stop offset="1" stop-color="#1a5fc4"/></linearGradient>
<radialGradient id="g1" cx=".85" cy=".3" r=".55"><stop offset="0" stop-color="#1a73e8" stop-opacity=".55"/><stop offset="1" stop-color="#1a73e8" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".1" cy="1" r=".5"><stop offset="0" stop-color="#8ab4f8" stop-opacity=".22"/><stop offset="1" stop-color="#8ab4f8" stop-opacity="0"/></radialGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bcd3ff"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
<mask id="tm"><text x="236" y="186" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-2.5" fill="#fff">Rungwise</text></mask>
</defs>
<style>
.rung{fill:#8ab4f8;opacity:.16;animation:lit 3.36s ease-out infinite}
@keyframes lit{0%{opacity:.16;fill:#8ab4f8}6%{opacity:1;fill:#ffffff}30%{opacity:.85;fill:#8ab4f8}88%{opacity:.6}100%{opacity:.16}}
.tick{fill:#fff;opacity:0;animation:tk 3.36s ease-out infinite}
@keyframes tk{0%{opacity:0}5%{opacity:1}20%{opacity:0}100%{opacity:0}}
.rail{stroke:#8ab4f8;stroke-opacity:.28;stroke-width:2;fill:none;stroke-linecap:round}
.rv{opacity:0;animation:rv .9s cubic-bezier(.2,.7,.2,1) forwards}.d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.shine{animation:sweep 6.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-380px)}55%,100%{transform:translateX(720px)}}
.drift{animation:dr 10s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(-36px,12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rung{opacity:.7}.rv{opacity:1}}
</style>
